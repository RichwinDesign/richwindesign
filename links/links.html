<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="RichwinDesign – Portalwelten, Twitch, Instagram, Ko-fi und Kontakt.">
  <title>Links | RichwinDesign</title>
  <link rel="stylesheet" href="links.css">
</head>
<body>
  <main class="link-page">
    <div class="link-content">
      <div class="glass-effects" aria-hidden="true"><div class="glass-aurora"></div><div class="glass-spotlight"></div></div>
      <h1 class="link-title">RichwinDesign</h1>
      <nav class="link-navigation" aria-label="RichwinDesign Bereiche">
        <a class="link-button" href="../portale.html"><span>Portalwelten</span></a>
        <a class="link-button" href="https://www.twitch.tv/bibiithecat" target="_blank" rel="noopener noreferrer"><span>Twitch</span></a>
        <a class="link-button" href="https://www.instagram.com/richwindesign/" target="_blank" rel="noopener noreferrer"><span>Instagram</span></a>
        <a class="link-button" href="https://ko-fi.com/richwindesign" target="_blank" rel="noopener noreferrer"><span>Ko-fi</span></a>
        <a class="link-button" href="../kontakt/kontakt.html"><span>Kontakt</span></a>
      </nav>
      <nav class="link-socials" aria-label="Weitere Social-Media-Profile">
        <a href="https://de.pinterest.com/RichwinDesign/" target="_blank" rel="noopener noreferrer" aria-label="Pinterest (öffnet in neuem Tab)"><img src="../images/general/icons/icon_social_pinterest.webp" alt="" width="33" height="33"></a>
        <a href="https://www.deviantart.com/richwindesign" target="_blank" rel="noopener noreferrer" aria-label="DeviantArt (öffnet in neuem Tab)"><img src="../images/general/icons/icon_social_deviantart.webp" alt="" width="33" height="33"></a>
      </nav>
    </div>
  </main>
  <script>
    (() => {
      const card = document.querySelector('.link-content');
      const surface = card?.querySelector('.glass-effects');
      if (!card || !surface || !matchMedia('(hover: hover) and (pointer: fine)').matches) return;
      card.addEventListener('pointermove', (event) => {
        const bounds = surface.getBoundingClientRect();
        surface.style.setProperty('--spot-x', `${event.clientX - bounds.left}px`);
        surface.style.setProperty('--spot-y', `${event.clientY - bounds.top}px`);
        card.classList.add('is-spotlit');
      }, { passive: true });
      card.addEventListener('pointerleave', () => card.classList.remove('is-spotlit'));
    })();
  </script>
</body>
</html>
