<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0909">
  <meta name="description" content="Die fünf Welten von RichwinDesign: Portalwelten, Portfolio, Genealogie, Unterstützung und Kontakt.">
  <title>Die Welten | RichwinDesign</title>
  <link rel="stylesheet" href="links.css">
  <script src="links.js" defer></script>
</head>
<body>
  <!-- 01 – Höhlenszene mit Steinblöcken auf dem Boden -->
  <main class="world-page" id="world-page">
    <div class="scene" aria-label="Die fünf Welten von RichwinDesign">

      <!-- 02 – Beschriftung oben, über den Portalen -->
      <header class="scene-heading">
        <div class="brand-mark" aria-hidden="true">✧ R ✧</div>
        <h1>BIANCA RICHWIN</h1>
        <p>DESIGN · KUNST · GENEALOGIE</p>
      </header>

      <!-- 03 – Die fünf Steine: jeweils ein echtes anklickbares Element -->
      <nav class="stone-worlds" aria-label="Welten auswählen">

        <a class="stone stone--left-outer" href="../portale.html" data-portal-transition aria-label="Portalwelten entdecken">
          <img src="../images/links/blocks/Block-links-01.webp" alt="" decoding="async">
          <span class="stone-label">PORTALWELTEN</span>
        </a>

        <a class="stone stone--left-inner" href="../index.html" data-portal-transition aria-label="Portfolio ansehen">
          <img src="../images/links/blocks/Block-links-02.webp" alt="" decoding="async">
          <span class="stone-label">PORTFOLIO</span>
        </a>

        <a class="stone stone--center" href="../genealogie/genealogie.html" data-portal-transition aria-label="Genealogie öffnen">
          <img src="../images/links/blocks/Block-mitte.webp" alt="" decoding="async">
          <span class="stone-label">GENEALOGIE</span>
        </a>

        <a class="stone stone--right-inner" href="https://ko-fi.com/richwindesign" target="_blank" rel="noopener noreferrer" aria-label="RichwinDesign auf Ko-fi unterstützen (öffnet neuen Tab)">
          <img src="../images/links/blocks/Block-rechts-01.webp" alt="" decoding="async">
          <span class="stone-label">KO-FI</span>
        </a>

        <a class="stone stone--right-outer" href="../kontakt/kontakt.html" data-portal-transition aria-label="Kontakt öffnen">
          <img src="../images/links/blocks/Block-rechts-02.webp" alt="" decoding="async">
          <span class="stone-label">KONTAKT</span>
        </a>
      </nav>

      <!-- 04 – Zusätzliche Links, bewusst zurückhaltend -->
      <div class="scene-bottom">
        <span class="muted-link" aria-disabled="true">Shop · demnächst</span>
        <span class="divider" aria-hidden="true">✧</span>
        <span class="muted-link" aria-disabled="true">Patreon · Link folgt</span>
        <span class="divider" aria-hidden="true">✧</span>
        <a href="https://www.instagram.com/richwindesign/" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="https://www.deviantart.com/richwindesign" target="_blank" rel="noopener noreferrer">DeviantArt</a>
        <a href="https://www.linkedin.com/in/bianca-christine-richwin/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </div>
      <footer class="scene-legal">
        <a href="../kontakt/impressum.html" data-portal-transition>Impressum</a>
        <span aria-hidden="true">·</span>
        <a href="../kontakt/datenschutz.html" data-portal-transition>Datenschutz</a>
      </footer>
    </div>
  </main>

  <!-- 05 – Dynamischer Efeuvorhang, nur auf dieser Linkseite -->
  <div class="ivy-overlay" id="ivy-overlay" aria-hidden="true">
    <div class="ivy-darkness"></div>
    <div class="ivy-leaves" id="ivy-leaves"></div>
  </div>
  <div class="edge-vignette" aria-hidden="true"></div>
  <button class="skip-intro" id="skip-intro" type="button" hidden>Animation überspringen</button>
</body>
</html>
