
<script>
(() => {
  "use strict";

  /* =========================================
     BILDNUMMERN
     ========================================= */

  const erichImages = Array.from(
    { length: 9 },
    (_, i) => i + 1
  );

  const hansImages = Array.from(
    { length: 91 },
    (_, i) => i + 1
  );

  /* =========================================
     GALERIE MIT SEITENWECHSEL
     ========================================= */

  function createGallery(options) {

    const container = document.getElementById(
      options.containerId
    );

    if (!container) return;

    const pageSize = options.pageSize || 12;
    const totalPages = Math.ceil(
      options.images.length / pageSize
    );

    let currentPage = 1;

    // Navigation unter der Galerie
    const pagination = document.createElement("nav");
    pagination.className = "art-pagination";
    pagination.setAttribute(
      "aria-label",
      "Galerieseiten von " + options.artist
    );

    container.insertAdjacentElement(
      "afterend",
      pagination
    );

    function renderPage() {

      // Alte Bilder vollständig entfernen
      container.replaceChildren();

      const start = (currentPage - 1) * pageSize;
      const currentImages = options.images.slice(
        start,
        start + pageSize
      );

      const fragment = document.createDocumentFragment();

      currentImages.forEach((number) => {

        const fileNumber = String(number).padStart(2, "0");

        const imagePath =
          options.folder + "/" +
          options.prefix + fileNumber + ".webp";

        const figure = document.createElement("figure");
        figure.className = "art-gallery-item";

        const img = document.createElement("img");
        img.src = imagePath;
        img.alt = options.artist + " – Werk " + fileNumber;
        img.loading = "lazy";
        img.decoding = "async";
        img.draggable = false;

        img.addEventListener("contextmenu", (event) => {
          event.preventDefault();
        });

        img.addEventListener("error", () => {
          figure.remove();
        });

        const caption = document.createElement("figcaption");
        caption.textContent = "WERK " + fileNumber;

        figure.append(img, caption);
        fragment.appendChild(figure);

      });

      container.appendChild(fragment);

      renderPagination();
    }

    function renderPagination() {

      pagination.replaceChildren();

      // Keine Navigation bei nur einer Seite
      if (totalPages <= 1) return;

      const previous = document.createElement("button");
      previous.type = "button";
      previous.className = "art-page-button";
      previous.textContent = "‹ Zurück";
      previous.disabled = currentPage === 1;

      const status = document.createElement("span");
      status.className = "art-page-status";
      status.textContent =
        "Seite " + currentPage + " von " + totalPages;

      const next = document.createElement("button");
      next.type = "button";
      next.className = "art-page-button";
      next.textContent = "Weiter ›";
      next.disabled = currentPage === totalPages;

      previous.addEventListener("click", () => {
        changePage(currentPage - 1);
      });

      next.addEventListener("click", () => {
        changePage(currentPage + 1);
      });

      pagination.append(previous, status, next);
    }

    function changePage(page) {

      if (page < 1 || page > totalPages) return;

      currentPage = page;
      renderPage();

      // Beim Blättern zum Künstlerbereich zurück
      const section = container.closest(".art-artist");

      if (section) {
        section.scrollIntoView({
          behavior: window.matchMedia(
            "(prefers-reduced-motion: reduce)"
          ).matches ? "auto" : "smooth",
          block: "start"
        });
      }
    }

    renderPage();
  }


  /* =========================================
     ERICH WILLY KLOTZ
     9 WERKE, EINE SEITE
     ========================================= */

  createGallery({
    containerId: "gallery-erich",
    images: erichImages,
    pageSize: 9,

    folder:
      "../../images/genealogie/kunstarchiv/erich-willy-klotz",

    prefix: "kunst_erich-klotz_",
    artist: "Erich Willy Klotz"
  });


  /* =========================================
     HANS-GEORG KLOTZ
     91 WERKE, 12 PRO SEITE
     ========================================= */

  createGallery({
    containerId: "gallery-hans",
    images: hansImages,
    pageSize: 12,

    folder:
      "../../images/genealogie/kunstarchiv/hans-georg-klotz",

    prefix: "kunst_hans-georg-klotz_",
    artist: "Hans-Georg Klotz"
  });

})();
</script>
